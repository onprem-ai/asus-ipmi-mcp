name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Syntax check
        run: for f in bin/*.js src/*.js test/*.js; do node --check "$f"; done
      - name: Server starts and lists tools
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | ASUS_IPMI_HOST=127.0.0.1 ASUS_IPMI_PASSWORD=x timeout 20 node bin/asus-ipmi-mcp.js | grep -q '"screenshot"'
